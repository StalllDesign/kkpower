<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KK Power Group – 3D Booth Presentation</title>
<style>
:root{--bl:#0f4f9c;--rd:#c3252d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#1d1f23;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#c{position:fixed;inset:0}
.glass{background:rgba(20,24,32,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:14px}
#top{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));padding:10px 16px;display:flex;align-items:center;gap:12px}
#top img{height:34px;border-radius:4px;background:#fff}
#top b{display:block;font-size:15px;letter-spacing:.02em}
#top span{font-size:12px;opacity:.7}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:6px;display:flex;gap:4px;max-width:calc(100vw - 20px);overflow-x:auto}
button{font:inherit;font-size:13px;color:#fff;background:transparent;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:var(--bl)}
#tg{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));padding:6px;display:flex;gap:4px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.65;pointer-events:none;text-align:center;width:90%}
.pin{position:fixed;left:0;top:0;pointer-events:auto;padding:5px 10px 5px 8px;font-size:12px;border-radius:99px;background:rgba(15,79,156,.92);border:1px solid #fff;color:#fff;display:flex;gap:6px;align-items:center;will-change:transform}
.pin:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
#ld{position:fixed;inset:0;background:#1d1f23;display:grid;place-items:center;font-size:14px;transition:opacity .6s;z-index:9}
#ld.h{opacity:0;pointer-events:none}
@media(max-width:640px){#top span{display:none}#top img{height:26px}#hint{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="c"></div><div id="pins"></div>
<div id="top" class="glass"><img src="assets/logo.jpg" alt="KK Power"><div><b>KK Power Group</b><span>Exhibition booth · interactive 3D presentation</span></div></div>
<div id="tg" class="glass"><button id="roof" class="on">Roof</button><button id="rot" class="on">Auto-rotate</button><button id="fs">Fullscreen</button></div>
<div id="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan · tap a pin to fly there</div>
<div id="bar" class="glass"></div>
<div id="ld">Loading 3D booth…</div>

<script type="module">
import*as T from 'three';
import{OrbitControls}from 'three/addons/controls/OrbitControls.js';

/* ---------- scene ---------- */
const $=s=>document.querySelector(s);
const R=new T.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
$('#c').appendChild(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x1d1f23);S.fog=new T.Fog(0x1d1f23,50,110);
const C=new T.PerspectiveCamera(42,1,.1,250);
const O=new OrbitControls(C,R.domElement);
O.enableDamping=true;O.maxPolarAngle=Math.PI/2-.02;O.minDistance=2;O.maxDistance=50;O.autoRotate=true;O.autoRotateSpeed=.7;

S.add(new T.HemisphereLight(0xffffff,0x4a505c,1.15));
const sun=new T.DirectionalLight(0xffffff,1.7);sun.position.set(-8,20,16);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:60});S.add(sun);
for(const p of[[.5,3,.5],[5.5,2.8,-1],[8.5,2.8,0],[-7.5,3,0]]){const l=new T.PointLight(0xfff0d0,14,8,2);l.position.set(...p);S.add(l)}

/* ---------- helpers ---------- */
const L=new T.TextureLoader();
const tex=n=>{const t=L.load('assets/'+n+'.jpg');t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;return t};
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=8;return t}
const M=(c,r=.55,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const white=M(0xeef1f4,.5),blue=M(0x0f4f9c,.45),red=M(0xc3252d,.5),dark=M(0x1b1b1e,.5,.4),gray=M(0xa5abb3,.35,.7),
 yel=M(0xe3ec1c,.5),sofaM=M(0xfbfbfb,.35),wd=M(0xd9b48a,.6),orange=M(0xd9822b,.5),
 glass=new T.MeshStandardMaterial({color:0xcfe8f0,transparent:true,opacity:.35,roughness:.1});
const G=new T.Group(),roofG=new T.Group();S.add(G,roofG);

function B(w,h,d,x,y,z,m,p=G){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}
function CY(r,h,x,y,z,m,p=G,rz=0){const o=new T.Mesh(new T.CylinderGeometry(r,r,h,20),m);o.position.set(x,y,z);o.rotation.z=rz;o.castShadow=true;p.add(o);return o}
function P(w,h,x,y,z,ry,map,p=G){const o=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map,toneMapped:false}));o.position.set(x,y,z);o.rotation.y=ry;p.add(o);return o}
function label(s,w,h,x,y,z,ry,bg='#0f4f9c',p=G){
 const t=cv(1024,Math.round(1024*h/w),(g,cw,ch)=>{g.fillStyle=bg;g.fillRect(0,0,cw,ch);let f=ch*.56;g.font=`600 ${f}px Arial`;while(g.measureText(s).width>cw*.88)g.font=`600 ${f-=4}px Arial`;g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(s,cw/2,ch/2+f*.04)});
 return P(w,h,x,y,z,ry,t,p)}
function spot(x,y,z,p=roofG){const m=new T.Mesh(new T.CircleGeometry(.09,14),new T.MeshBasicMaterial({color:0xfff0c8}));m.rotation.x=Math.PI/2;m.position.set(x,y,z);p.add(m)}

/* ---------- textures ---------- */
const logo=tex('logo');
const woodT=cv(512,512,(g)=>{g.fillStyle='#a87c4c';g.fillRect(0,0,512,512);for(let r=0;r<8;r++)for(let c=-1;c<3;c++){g.fillStyle=`hsl(34,${55+Math.random()*10}%,${64+Math.random()*10}%)`;g.fillRect(c*256+(r%2?-110:0)+1,r*64+1,253,62)}});
const conc=cv(512,512,(g)=>{g.fillStyle='#2c2e33';g.fillRect(0,0,512,512);for(let i=0;i<1400;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${Math.random()*.07})`;g.fillRect(Math.random()*512,Math.random()*512,Math.random()*60,Math.random()*60)}});
conc.repeat.set(24,24);
const ground=new T.Mesh(new T.PlaneGeometry(160,160),new T.MeshStandardMaterial({map:conc,roughness:.32,metalness:.15}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

function deck(x0,x1,z0=-3,z1=3){const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
 B(w+.12,.08,d+.12,cx,.04,cz,blue);
 const t=woodT.clone();t.needsUpdate=true;t.repeat.set(w/2.4,d/2.4);
 B(w,.03,d,cx,.095,cz,new T.MeshStandardMaterial({map:t,roughness:.5}))}

/* ---------- furniture ---------- */
function chair(x,z,ry){const g=new T.Group();g.position.set(x,.11,z);g.rotation.y=ry;
 B(.42,.05,.42,0,.45,0,white,g);const b=B(.42,.4,.05,0,.7,-.2,white,g);b.rotation.x=-.2;
 for(const[a,c]of[[-.15,-.15],[.15,-.15],[-.15,.15],[.15,.15]]){const l=B(.03,.45,.03,a,.22,c,wd,g);l.rotation.z=a*1.2}G.add(g)}
function tableSet(x,z){CY(.5,.02,x,.82,z,glass);CY(.03,.7,x,.46,z,gray);
 for(let i=0;i<4;i++){const a=i*Math.PI/2+.4;chair(x+Math.sin(a)*.8,z+Math.cos(a)*.8,a+Math.PI)}}
function sofa(x,z,ry,w=.9){const g=new T.Group();g.position.set(x,.11,z);g.rotation.y=ry;
 B(w,.4,.8,0,.2,0,sofaM,g);B(w,.5,.2,0,.62,-.3,sofaM,g);B(.15,.5,.8,-w/2+.07,.4,0,sofaM,g);B(.15,.5,.8,w/2-.07,.4,0,sofaM,g);G.add(g)}
function scrubber(x,z,ry){const g=new T.Group();g.position.set(x,.11,z);g.rotation.y=ry;
 B(.8,.1,1,0,.16,0,dark,g);CY(.28,.7,0,.5,-.1,M(0xe6eadb,.4),g,Math.PI/2);B(.16,.12,.2,.38,.5,-.1,dark,g);
 const h=CY(.025,1.3,0,.9,.45,orange,g);h.rotation.x=.35;G.add(g)}
function rack(x,z,len,ry){const g=new T.Group();g.position.set(x,.11,z);g.rotation.y=ry;
 for(const y of[.3,.9,1.5,2.1])B(len,.03,.5,0,y,0,dark,g);
 for(let i=0;i<=Math.round(len);i++)for(const s of[-.24,.24])B(.04,2.2,.04,-len/2+i*len/Math.round(len),1.1,s,dark,g);G.add(g)}

/* ---------- forklift ---------- */
{const g=new T.Group();g.position.set(-3,.05,.1);g.scale.setScalar(1.15);G.add(g);
 B(1.3,.35,2.3,0,.45,-.1,dark,g);B(1.3,.8,1.7,0,.95,-.35,yel,g);B(1.2,.4,.5,0,.85,.65,yel,g);
 B(.5,.1,.5,0,1.42,-.55,white,g);B(1.2,.06,1.1,0,2.1,-.5,dark,g);
 for(const[a,c]of[[-.55,-.95],[.55,-.95],[-.55,.05],[.55,.05]])B(.05,1.5,.05,a,1.35,c,dark,g);
 for(const s of[-.35,.35]){B(.13,2.7,.1,s,1.5,.9,yel,g);B(.15,.05,1.3,s,.12,1.6,dark,g)}
 B(1,.12,.1,0,2.6,.9,yel,g);B(.95,.5,.08,0,.9,1.05,M(0xd9a864),g);
 for(const[a,c]of[[-.72,.5],[.72,.5],[-.7,-.8],[.7,-.8]])CY(.36,.24,a,.36,c,dark,g,Math.PI/2)}

/* ============ WAREHOUSE & RACKING BOOTH (x -10.5 … -4.5) ============ */
deck(-10.5,-4.5);
for(const[x,z]of[[-10.3,-2.8],[-4.7,-2.8],[-10.3,2.8],[-4.7,2.8]])B(.4,3.35,.4,x,1.75,z,blue);
for(const[w,d,x,z]of[[6.3,.3,-7.5,3],[6.3,.3,-7.5,-3],[.3,6,-10.5,0],[.3,6,-4.5,0]])B(w,.65,d,x,3.7,z,white,roofG);
B(5.5,.08,5.4,-7.5,3.3,0,white,roofG);
P(.9,.67,-7.5,3.7,3.16,0,logo,roofG);P(.9,.67,-7.5,3.7,-3.16,Math.PI,logo,roofG);
for(const x of[-9.2,-7.5,-5.8])for(const z of[-1.6,1.4])spot(x,3.25,z);
B(5.6,2.9,.12,-7.5,1.5,-2.85,white);B(.1,2.9,3,-10.3,1.5,-1.4,white);
label('Warehouse & Racking',4.4,.5,-7.2,2.7,-2.77,0);
label('Warehouse & Racking',2.8,.5,-10.23,2.7,-1.4,Math.PI/2);
P(2.6,2.2,-8.9,1.4,-2.93,Math.PI,tex('aerial'));
rack(-9.9,-1,3.4,Math.PI/2);rack(-7.9,-2.5,3.4,0);
B(.9,.4,.9,-7.5,.3,.3,glass);
sofa(-8.4,.3,Math.PI/2);sofa(-6.6,.3,-Math.PI/2);sofa(-7.5,-.6,0);sofa(-7.5,1.2,Math.PI);

/* ============ MAIN BOOTH (x -1.5 … 10.5) ============ */
deck(-1.5,10.5);
/* roofs (split along the diagonal) */
function roof(pts,y0,h,m){const s=new T.Shape();pts.forEach(([x,z],i)=>i?s.lineTo(x,-z):s.moveTo(x,-z));
 const g=new T.ExtrudeGeometry(s,{depth:h,bevelEnabled:false});g.rotateX(-Math.PI/2);
 const o=new T.Mesh(g,m);o.position.y=y0;o.castShadow=true;roofG.add(o)}
roof([[-1.5,-3],[3.4,-3],[7.2,3],[-1.5,3]],3.3,.6,white);
roof([[3.4,-3],[10.5,-3],[10.5,3],[7.2,3]],3.1,.65,white);
roof([[-1.5,-3],[3.4,-3],[7.2,3],[-1.5,3]],3.2,.1,blue);
roof([[3.4,-3],[10.5,-3],[10.5,3],[7.2,3]],3.0,.1,blue);
for(const[x,y,z,r]of[[1.5,3.6,3.01,0],[8.9,3.45,3.01,0],[1.2,3.6,-3.01,Math.PI],[5.2,3.45,-3.01,Math.PI],[9,3.45,-3.01,Math.PI]])P(.9,.67,x,y,z,r,logo,roofG);
for(const[x,z]of[[-.5,-1.5],[-.5,1.5],[1.2,-1.5],[1.2,.5],[2.8,-1.5],[7.5,-1.5],[8.6,0],[9.6,-1.5],[7.8,1.8]])spot(x,x>5?2.98:3.18,z);
/* loop frame (C-shaped arch at the front) */
{const s=new T.Shape();s.moveTo(-1.5,3.92);s.lineTo(3.7,3.92);s.quadraticCurveTo(4.5,3.92,4.5,3.1);s.lineTo(4.5,.9);s.quadraticCurveTo(4.5,0,3.6,0);
 s.lineTo(-1.5,0);s.lineTo(-1.5,.25);s.lineTo(3.55,.25);s.quadraticCurveTo(3.95,.25,3.95,.9);s.lineTo(3.95,3.0);s.quadraticCurveTo(3.95,3.3,3.55,3.3);s.lineTo(-1.5,3.3);s.closePath();
 const o=new T.Mesh(new T.ExtrudeGeometry(s,{depth:.5,bevelEnabled:false}),white);o.position.z=2.45;o.castShadow=true;G.add(o);
 B(.07,3.92,.5,4.53,1.96,2.7,blue);B(5.9,.07,.5,1.45,3.28,2.7,blue)}
/* poles + pillar column at end */
for(const[x,z]of[[-1,2.9],[.5,2.9],[6.75,2.9]])CY(.04,3.3,x,1.65,z,gray);
/* back wall + end wall */
B(7.5,3.0,.14,6.75,1.5,-2.93,blue);
P(1.9,1.9,4.15,1.4,-2.85,0,tex('cleaning'));
B(.4,2.4,.3,5.3,1.25,-2.8,red);B(.4,2.4,.3,7.6,1.25,-2.8,red);
B(1.9,2.4,.1,6.45,1.25,-2.84,white);B(1.7,.05,.3,6.45,1.95,-2.72,blue);B(1.7,.05,.3,6.45,1.45,-2.72,blue);B(1.8,.8,.4,6.45,.52,-2.72,blue);
P(2.0,2.1,8.8,1.4,-2.85,0,tex('fkwall'));
label('Industrial Cleaning',2.0,.5,4.15,2.72,-2.85,0);label('Power Solution',1.9,.5,6.45,2.72,-2.85,0);label('Aerial Access',2.0,.5,8.8,2.72,-2.85,0);
B(.3,3.1,6,10.35,1.55,0,blue);
P(3.8,2.0,10.19,1.4,-.9,-Math.PI/2,tex('mh'));label('Material Handling',3.8,.5,10.19,2.72,-.9,-Math.PI/2);
P(4.6,2.1,8.1,1.4,-3.02,Math.PI,tex('handling'));P(2.4,2.1,4.3,1.4,-3.02,Math.PI,tex('cleaning'));B(.35,2.3,.05,5.6,1.3,-3.03,red);
/* TV pillar */
B(1.2,2.0,1,4.35,1,0,blue);B(1.9,1.15,.18,4.35,2.65,0,dark);
P(1.8,1.04,4.35,2.65,.1,0,tex('tv'));P(1.8,1.04,4.35,2.65,-.1,Math.PI,tex('tv'));
/* counters */
B(2.8,.35,.9,-.1,.3,2.45,blue);B(2.8,.75,.9,-.1,.8,2.45,white);P(1.1,.82,-.1,.75,2.91,0,logo);
B(2.4,.35,.9,9.3,.3,2.5,blue);B(2.4,.75,.9,9.3,.8,2.5,white);P(1.2,.9,9.3,.75,2.96,0,logo);
B(2.2,.6,.8,0,.4,-2.4,blue);CY(.18,.75,-.95,.45,1,white);
/* seating & machines */
tableSet(1.9,.1);tableSet(6,.1);
scrubber(2.75,-1.8,0);scrubber(4.3,-1.8,0);scrubber(-.4,-.1,Math.PI/2);
sofa(9.6,-2.0,-Math.PI/2);sofa(9.6,-.8,-Math.PI/2);sofa(9.6,.1,-Math.PI/2);sofa(8.8,1.1,Math.PI);
B(.7,.4,.7,8.7,.3,-.5,glass);

/* ---------- camera views ---------- */
const V={
 persp:{n:'Overview',p:[-4,10,27],t:[0,1.5,0]},
 front:{n:'Front',p:[0,3.5,31],t:[0,2,0]},
 back:{n:'Back',p:[0,3.5,-31],t:[0,2,0]},
 top:{n:'Plan view',p:[0,40,.5],t:[0,0,0]},
 inside:{n:'Walk-in',p:[.3,1.65,2.3],t:[6,1.4,-1.8]},
 warehouse:{n:'Warehouse',p:[-7.5,1.8,2.6],t:[-7.5,1.2,-2.5]},
 cleaning:{p:[3.4,1.7,1.9],t:[4.15,1.4,-2.8]},power:{p:[6.4,1.7,1.5],t:[6.4,1.4,-2.8]},
 aerial:{p:[8,1.7,1.5],t:[8.8,1.4,-2.8]},handling:{p:[6.5,1.7,.6],t:[10.2,1.4,-.9]},
 tv:{p:[4.35,2,5.2],t:[4.35,2.5,0]}};
const pins=[['Industrial Cleaning',[4.15,2.2,-2.7],'cleaning'],['Power Solution',[6.45,2.3,-2.7],'power'],['Aerial Access',[8.8,2.2,-2.7],'aerial'],['Material Handling',[10.1,2.2,-.9],'handling'],['Live screen',[4.35,3.4,0],'tv'],['Warehouse & Racking',[-7.5,2.4,-2.6],'warehouse']];
let tw=null;
function fly(k,keepRot){const v=V[k];if(!keepRot){O.autoRotate=false;$('#rot').classList.remove('on')}
 tw={t0:performance.now(),p0:C.position.clone(),q0:O.target.clone(),p1:new T.Vector3(...v.p),q1:new T.Vector3(...v.t)};
 document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===k))}
for(const k of['persp','front','back','top','inside','warehouse']){const b=document.createElement('button');b.textContent=V[k].n;b.dataset.v=k;b.onclick=()=>fly(k);$('#bar').appendChild(b)}
const pinEls=pins.map(([n,p,k])=>{const e=document.createElement('button');e.className='pin';e.textContent=n;e.onclick=()=>fly(k);$('#pins').appendChild(e);return{e,v:new T.Vector3(...p)}});

C.position.set(...V.persp.p);O.target.set(...V.persp.t);
$('#bar button').classList.add('on');
O.addEventListener('start',()=>{O.autoRotate=false;$('#rot').classList.remove('on');tw=null});

/* ---------- UI ---------- */
$('#roof').onclick=e=>{roofG.visible=!roofG.visible;e.target.classList.toggle('on',roofG.visible)};
$('#rot').onclick=e=>{O.autoRotate=!O.autoRotate;e.target.classList.toggle('on',O.autoRotate)};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
function size(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',size);size();
T.DefaultLoadingManager.onLoad=()=>$('#ld').classList.add('h');
setTimeout(()=>$('#ld').classList.add('h'),8000);

/* ---------- loop ---------- */
const tmp=new T.Vector3();
R.setAnimationLoop(()=>{
 if(tw){let k=Math.min(1,(performance.now()-tw.t0)/1500);k=k*k*(3-2*k);C.position.lerpVectors(tw.p0,tw.p1,k);O.target.lerpVectors(tw.q0,tw.q1,k);if(k>=1)tw=null}
 O.update();R.render(S,C);
 for(const{e,v}of pinEls){tmp.copy(v).project(C);const ok=tmp.z<1&&Math.abs(tmp.x)<1.05&&C.position.distanceTo(v)<30;
  e.style.display=ok?'':'none';if(ok)e.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`}
});
</script>
</body>
</html>
